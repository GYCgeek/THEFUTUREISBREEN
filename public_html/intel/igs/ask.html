<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Ask the Graph — New Alignment IGS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Source+Sans+3:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./ask/ask.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: "Source Sans 3", system-ui, sans-serif;
      background:
        radial-gradient(ellipse 70% 55% at 20% 6%, rgba(124,184,154,0.10), transparent 55%),
        radial-gradient(ellipse 55% 45% at 88% 92%, rgba(196,181,140,0.08), transparent 55%),
        #0d1512;
      color: #f3efe6;
      display: flex; flex-direction: column; align-items: center;
      padding: 1rem;
    }
    .topbar {
      width: 100%; max-width: 780px; display: flex; align-items: center; gap: 0.7rem;
      padding: 0.6rem 0.2rem 1rem;
    }
    .mark {
      width: 30px; height: 30px; border-radius: 9px;
      background: linear-gradient(135deg, #7cb89a, #cbbb8f); display: grid; place-items: center; flex-shrink: 0;
    }
    .mark svg { width: 18px; height: 18px; }
    .brand b { font-family: "Fraunces", Georgia, serif; font-weight: 600; font-size: 0.98rem; display: block; line-height: 1.05; }
    .brand span { font-family: "IBM Plex Mono", monospace; font-size: 0.58rem; letter-spacing: 0.08em; text-transform: uppercase; color: #728375; }
    .topbar .links { margin-left: auto; display: flex; gap: 0.5rem; }
    .topbar a {
      display: inline-flex; align-items: center; gap: 0.35rem; text-decoration: none;
      background: rgba(20,32,26,0.72); border: 1px solid rgba(196,181,140,0.18); border-radius: 11px;
      padding: 0.45rem 0.7rem; color: #aebbb0; font-size: 0.8rem;
    }
    .topbar a:hover { color: #f3efe6; border-color: rgba(196,181,140,0.32); }
    .topbar a svg { width: 15px; height: 15px; }
    .card {
      width: 100%; max-width: 780px; flex: 1; min-height: 0;
      background: rgba(20,32,26,0.72); backdrop-filter: blur(22px) saturate(1.3);
      -webkit-backdrop-filter: blur(22px) saturate(1.3);
      border: 1px solid rgba(196,181,140,0.18); border-radius: 18px;
      box-shadow: 0 24px 60px -20px rgba(0,0,0,0.7); padding: 1.3rem 1.4rem;
      display: flex; flex-direction: column;
    }
    .foot-note {
      width: 100%; max-width: 780px; text-align: center; color: #728375;
      font-family: "IBM Plex Mono", monospace; font-size: 0.62rem; padding: 0.8rem 0 0.2rem;
    }
    @media (max-width: 640px) {
      body { padding: max(0.6rem, env(safe-area-inset-top)) 0.7rem max(0.6rem, env(safe-area-inset-bottom)); }
      .topbar { padding: 0.4rem 0.1rem 0.75rem; gap: 0.5rem; }
      .brand span { display: none; }
      .topbar a { padding: 0.55rem; min-width: 44px; min-height: 44px; justify-content: center; }
      .topbar a .lbl { display: none; }
      .card { padding: 0.85rem 0.9rem; border-radius: 14px; }
      .foot-note { font-size: 0.58rem; padding: 0.6rem 0.4rem 0.1rem; }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <span class="mark">
      <svg viewBox="0 0 24 24" fill="none" stroke="#0f1814" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="7" r="2.4"/><circle cx="18" cy="7" r="2.4"/><circle cx="12" cy="17" r="2.4"/><path d="M8 8l3 7M16 8l-3 7M8.2 7h7.6"/></svg>
    </span>
    <span class="brand"><b>New Alignment · IGS</b><span>Intergenerational Justice &amp; Solidarity</span></span>
    <span class="links">
      <a href="./graph.html" aria-label="Graph"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="7" r="2"/><circle cx="18" cy="7" r="2"/><circle cx="12" cy="17" r="2"/><path d="M8 8l3 7M16 8l-3 7"/></svg><span class="lbl"> Graph</span></a>
      <a href="./dashboard.html" aria-label="People"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg><span class="lbl"> People</span></a>
    </span>
  </div>

  <div class="card"><div id="ask-root"></div></div>

  <div class="foot-note">Runs in your browser via WebGPU · grounded in the IGS knowledge graph · no data leaves your device</div>

  <script src="./ask/graph-index.js"></script>
  <script src="./ask/retriever.js"></script>
  <script src="./ask/ask.js"></script>
</body>
</html>
