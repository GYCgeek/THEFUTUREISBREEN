    - { text: "Works alongside the Youth Negotiators Academy", status: confirmed }

governance:
  structure: "Founder → Administrative Circle → Chair → Champs Council → Working Teams. Authority is distributed by function, not personality."
  chair: { name: "Merna A. Elboghdady", country: Egypt, since: "2026-09-08", status: confirmed, note: "an older note says 1 Oct 2026 — see Q12" }
  founder: { name: "Agustín Ocaña Escobar", title: "Founder & Strategic Director", country: Ecuador, status: confirmed }
  communications_director: { name: "Bianca Malfert", title: "Director of Communication", status: confirmed, source: "Champs 2026 First Mission", note: "roadmap writes 'Bianca M. Gutierrez' — Q3 kept open only to confirm" }
  administrative_circle: "Institutional support and oversight: financial oversight, grant compliance, risk monitoring, partnership vetting, institutional continuity. Provides oversight without directing execution."
  founder_role: "Strategic coherence: multi-year positioning, institutional partnerships, long-term continuity. Does not intervene in normal strategic or operational decisions. Not to be presented as connected to the Avocado Framework (its steward is Zach Lubin)."
  chair_role: "Operational coordination: coordinates programmes and strategy execution, ensures alignment across tracks, decision authority within operational scope, participates in the Administrative Circle."
  champs_council: "Programme leadership (11 Champs): Skills Pipeline leads (CET / LD / NBS), quarterly deliverables, initiative coordination. The primary engine of the 2026 strategy."
  working_teams: ["Coordination & System Unit (operations and delivery)", "Comms Team (campaign implementation)", "Policy and Research Teams (research and policy support)", "Engagement Team (online and in-person events)"]
  decision_domains:
    strategic: "Partnerships, governance changes, large grants, direction. Proposed by Chair or Founder, reviewed by the Administrative Circle, decided by the Chair."
    operational: "Programme structure, timelines, delivery, events. Champs propose, Council consulted, Chair decides. Consultation, not voting."
    execution: "Logistics, scheduling, posting, meetings. No approval needed inside each person's scope."
  rhythm: "90-day cycles: Clarity → Output → Review → Institutional memory. Mid-cycle informal check, end-of-cycle structured review."
  diagram: "Internal draft lives in the GYC Drive (Distributed_Governance_Molecular_Diagram_3.png). Ask for it via QUESTIONS when redrawing; do not commit it."

