strategy_2026:
  # The strategic frame the site should express. Use these words; do not invent new framings.
  name: "The Year We Became the Sky"
  short: "The Year of the Sky"
  core_shift: "From inspiration to institutionalisation"
  public_line: "2026 is not a year of louder messaging. It is a year of discipline, perspective and structural maturity."
  mandate: "Clarity over chaos, structure over spectacle, capability over commentary."
  meaning: "Altitude: rising above turbulence to see patterns clearly and prepare — not decoration, not branding."
  arc:
    - { year: 2025, name: Ocean, meaning: "Expanded the network and connections across regions; community, storytelling, shared identity. (2025 Report: 'The year we became the Ocean')" }
    - { year: 2026, name: Sky, meaning: "Altitude: discipline, leadership transfer, structural clarity. We are here." }
    - { year: 2027, name: Roots, meaning: "Anchor capability locally: micro-governance pilots, local hubs, community implementation of the Avocado Framework." }
    - { year: 2028, name: Fire, meaning: "Leverage, not rage: strategic policy engagement, financial alignment, institutional partnerships, earned credibility in negotiation spaces." }
  arc_line: "Fire without Sky is instability. Fire after Sky is influence."
  shift_line: "From visibility to credibility."
  funding_line: "We are not selling outrage. We are building human infrastructure."
  skills_pipeline:
    lens: "The Avocado Framework is the lens; the Skills Pipeline is the delivery system."
    tracks:
      CET: { name: "Clean Energy Transition — green jobs and transition literacy", from_af_pillar: "Clean, Just Energy Transition" }
      LD: { name: "Governance and negotiation literacy", from_af_pillar: "Loss & Damage" }
      NBS: { name: "Nature-Based Solutions and responsible AI literacy", from_af_pillar: "Nature-Based Solutions", note: "Ecological literacy first, technological literacy second — in that order." }
  programme_roles:
    GYCT: "The intellectual engine: systems literacy, procedurally literate participants at SB and COP."
    R4P: "The human and relational stabiliser: connection infrastructure, not protest infrastructure."
    COP_presence: "Where GYCT's systems literacy and R4P's relational grounding converge."
    youth_house: "One of the clearest proofs of Sky in practice: youth infrastructure, not youth presence."
  operational_pillars: ["GYCT delivery & evolution", "Avocado Framework implementation", "Policy positioning in SB & COP processes", "Reeforesting for Peace (R4P) activation", "Project incubation & regional elevation"]
  success_markers:
    - "GYCT runs through distributed facilitation, not centralised leadership"
    - "Youth engage at COP with procedural literacy, not symbolic presence"
    - "R4P activations produce documented ecological and social outcomes"
    - "The Avocado Framework moves from narrative into applied practice"
    - "Independent leadership nodes work without continuous intervention"
  timeline: "September = structural lock. October = Advanced Cohort stress test with reduced Chair intervention. November COP31 = the public audit of Sky."
  what_gyc_is_not: "Not a social media campaign network driven by visibility metrics. Not symbolic representation. Not a centralised organisation where every initiative needs approval. Not a personality-driven platform."
  closing_line: "WE ARE ONE."

