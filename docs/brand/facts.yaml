organisation:
  name: Global Youth Coalition
  short_name: GYC
  founded: "COP27, Sharm El-Sheikh, 2022"
  legal_form: "Association under Swiss law (Art. 60 ff. Swiss Civil Code), Zurich"
  description_one_line: "A youth-led climate coalition that trains young people for climate negotiations, builds tools and research, and brings them into the rooms where decisions are made."
  identity_note: "Changemakers, not activists. Builders and negotiators, not protesters."
  run_by: "Largely unsalaried people under thirty"
  countries_active: { value: "170+", status: confirmed, note: "About page currently says 178 — see Q11" }
  credentials:
